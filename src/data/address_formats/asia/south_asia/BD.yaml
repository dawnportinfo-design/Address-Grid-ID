countryCode: BD
name: Bangladesh
native:
  name: বাংলাদেশ
  addressFormat: |-
    {{organization}}
    {{houseNumber}}, {{street}}
    {{suburb}}
    {{city}} - {{postcode}}
    {{state}}
  ordering: small-to-big
  fields:
    - key: organization
      label: ভবন/কোম্পানি
      placeholder: বঙ্গভবন
      required: false
      type: text
    - key: houseNumber
      label: বাসা নম্বর
      placeholder: ১২৩
      required: true
      type: text
    - key: street
      label: রাস্তা
      placeholder: মিরপুর রোড
      required: true
      type: text
    - key: suburb
      label: এলাকা
      placeholder: ধানমন্ডি
      required: false
      type: text
    - key: city
      label: শহর
      placeholder: ঢাকা
      required: true
      type: text
    - key: state
      label: বিভাগ
      placeholder: ঢাকা
      required: true
      type: text
    - key: postcode
      label: পোস্টাল কোড
      placeholder: ১২০৫
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{houseNumber}}, {{street}}
    {{suburb}}
    {{city}} - {{postcode}}
    {{state}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Company
      placeholder: Bangabhaban
      required: false
      type: text
    - key: houseNumber
      label: House No.
      placeholder: "123"
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Mirpur Road
      required: true
      type: text
    - key: suburb
      label: Area
      placeholder: Dhanmondi
      required: false
      type: text
    - key: city
      label: City
      placeholder: Dhaka
      required: true
      type: text
    - key: state
      label: Division
      placeholder: Dhaka
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "1205"
      required: true
      type: text
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://bdpost.portal.gov.bd/
  source: Bangladesh Post / Survey of Bangladesh / OSM Bangladesh
addressRules:
  languages:
    - code: bn
      name: Bengali
    - code: en
      name: English
  nativeOrder:
    - recipient
    - houseOrStreet
    - upazilaOrThana
    - district
    - postcode
    - country
  englishOrder:
    - recipient
    - houseOrStreet
    - upazilaOrThana
    - district
    - postcode
    - country
  regionalHierarchy:
    - district
  postalCode:
    label: 4 digits required
    required: true
    usage: required
  openSourceIds:
    - bd-post
    - survey-bangladesh
    - osm-bangladesh
    - hot-osm-bangladesh
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nasa-srtm
    - jaxa-aw3d30
    - gebco-bathymetry
    - gmrt-topography
    - hydrosheds
    - esa-worldcover
    - protected-planet-wdpa
    - gbif-occurrence
