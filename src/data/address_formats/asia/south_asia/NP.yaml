countryCode: NP
name: Nepal
native:
  name: नेपाल
  addressFormat: |-
    {{organization}}
    {{houseNumber}}, {{street}}
    {{suburb}}
    {{city}} {{postcode}}
    {{state}}
  ordering: small-to-big
  fields:
    - key: organization
      label: भवन/कम्पनी
      placeholder: नारायणहिटी दरबार
      required: false
      type: text
    - key: houseNumber
      label: घर नम्बर
      placeholder: १२३
      required: false
      type: text
    - key: street
      label: सडक
      placeholder: दरबार मार्ग
      required: true
      type: text
    - key: suburb
      label: टोल/क्षेत्र
      placeholder: लाजिम्पाट
      required: false
      type: text
    - key: city
      label: शहर
      placeholder: काठमाडौं
      required: true
      type: text
    - key: state
      label: प्रदेश
      placeholder: बागमती प्रदेश
      required: true
      type: text
    - key: postcode
      label: हुलाक कोड
      placeholder: ४४६००
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{houseNumber}}, {{street}}
    {{suburb}}
    {{city}} {{postcode}}
    {{state}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Company
      placeholder: Narayanhiti Palace
      required: false
      type: text
    - key: houseNumber
      label: House No.
      placeholder: "123"
      required: false
      type: text
    - key: street
      label: Street
      placeholder: Durbar Marg
      required: true
      type: text
    - key: suburb
      label: Tole/Area
      placeholder: Lazimpat
      required: false
      type: text
    - key: city
      label: City
      placeholder: Kathmandu
      required: true
      type: text
    - key: state
      label: Province
      placeholder: Bagmati Province
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "44600"
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://nepalpost.gov.np/content/1716/1716-postal-codes-of-nepal/
  source: Nepal Post / National Geoportal Nepal / Survey Department Nepal
addressRules:
  languages:
    - code: ne
      name: Nepali
    - code: en
      name: English
  nativeOrder:
    - recipient
    - houseOrStreet
    - wardOrMunicipality
    - district
    - province
    - postcode
    - country
  englishOrder:
    - recipient
    - houseOrStreet
    - wardOrMunicipality
    - district
    - province
    - postcode
    - country
  regionalHierarchy:
    - provinceOrDistrict
  postalCode:
    label: 5 digits required
    required: true
    usage: required
  openSourceIds:
    - postalservice-np
    - national-geoportal-nepal
    - survey-department-nepal
    - osm-nepal
    - hot-osm-nepal
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nasa-srtm
    - jaxa-aw3d30
    - gebco-bathymetry
    - gmrt-topography
    - hydrosheds
    - esa-worldcover
    - protected-planet-wdpa
    - gbif-occurrence
