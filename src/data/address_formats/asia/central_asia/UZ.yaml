countryCode: UZ
name: Uzbekistan
native:
  name: O'zbekiston
  addressFormat: |-
    {{postcode}}
    {{state}}, {{city}}
    {{street}}, {{houseNumber}}
    {{organization}}
  ordering: big-to-small
  fields:
    - key: postcode
      label: Pochta indeksi
      placeholder: "100000"
      required: true
      type: text
    - key: state
      label: Viloyat
      placeholder: Toshkent viloyati
      required: true
      type: text
    - key: city
      label: Shahar/Tuman
      placeholder: Toshkent
      required: true
      type: text
    - key: street
      label: Ko'cha
      placeholder: Amir Temur ko'chasi
      required: true
      type: text
    - key: houseNumber
      label: Uy/Xonadon
      placeholder: "1"
      required: true
      type: text
    - key: organization
      label: Bino/Idora
      placeholder: ""
      required: false
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{city}}, {{state}}
    {{postcode}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Office
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: House/Apt No.
      placeholder: "1"
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Amir Temur St
      required: true
      type: text
    - key: city
      label: City
      placeholder: Tashkent
      required: true
      type: text
    - key: state
      label: Province
      placeholder: Tashkent Region
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "100000"
      required: true
      type: text
postalCode:
  format: NNNNNN
  regex: ^\d{6}$
  api: https://www.uz.post/
  source: O'zbekiston Pochtasi / Uzbekistan Open Data / State Urban Cadastre
addressRules:
  languages:
    - code: uz
      name: Uzbek
    - code: ru
      name: Russian
  nativeOrder:
    - recipient
    - street
    - house
    - city
    - viloyat
    - postcode
  englishOrder:
    - recipient
    - street
    - house
    - city
    - region
    - postcode
  russianOrder:
    - recipient
    - street
    - house
    - city
    - oblast
    - postcode
  regionalHierarchy:
    - viloyat
  postalCode:
    label: 6 digits required
    required: true
    usage: required
  openSourceIds:
    - pochta-uz
    - uzbekistan-open-data-geo
    - uzbekistan-state-urban-cadastre
    - osm-uzbekistan
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nasa-srtm
    - jaxa-aw3d30
    - gebco-bathymetry
    - gmrt-topography
    - hydrosheds
    - esa-worldcover
    - protected-planet-wdpa
    - gbif-occurrence
