countryCode: TJ
name: Tajikistan
native:
  name: Тоҷикистон
  addressFormat: |-
    {{postcode}}
    {{state}}, {{city}}
    {{street}}, {{houseNumber}}
    {{organization}}
  ordering: big-to-small
  fields:
    - key: postcode
      label: Индекси почта
      placeholder: "734000"
      required: true
      type: text
    - key: state
      label: Вилоят
      placeholder: Душанбе
      required: true
      type: text
    - key: city
      label: Шаҳр/Ноҳия
      placeholder: Душанбе
      required: true
      type: text
    - key: street
      label: Кӯча
      placeholder: хиёбони Рӯдакӣ
      required: true
      type: text
    - key: houseNumber
      label: Хона/Ҳуҷра
      placeholder: "1"
      required: true
      type: text
    - key: organization
      label: Бино/Идора
      placeholder: ""
      required: false
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{city}}, {{state}}
    {{postcode}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Office
      placeholder: ""
      required: false
      type: text
    - key: houseNumber
      label: House/Apt No.
      placeholder: "1"
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Rudaki Ave
      required: true
      type: text
    - key: city
      label: City
      placeholder: Dushanbe
      required: true
      type: text
    - key: state
      label: Province
      placeholder: Dushanbe
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "734000"
      required: true
      type: text
postalCode:
  format: NNNNNN
  regex: ^\d{6}$
  api: http://www.tajikpost.tj/
  source: Tajik Post / OSM Tajikistan / OpenAerialMap
addressRules:
  languages:
    - code: tg
      name: Tajik
    - code: ru
      name: Russian
  nativeOrder:
    - recipient
    - street
    - house
    - city
    - viloyat
    - postcode
  englishOrder:
    - recipient
    - street
    - house
    - city
    - region
    - postcode
  russianOrder:
    - recipient
    - street
    - house
    - city
    - oblast
    - postcode
  regionalHierarchy:
    - viloyat
  postalCode:
    label: 6 digits required
    required: true
    usage: required
  openSourceIds:
    - tajik-post
    - osm-tajikistan
    - openaerialmap-tajikistan
    - hot-osm-central-asia
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nasa-srtm
    - jaxa-aw3d30
    - gebco-bathymetry
    - gmrt-topography
    - hydrosheds
    - esa-worldcover
    - protected-planet-wdpa
    - gbif-occurrence
openSourceIds:
