countryCode: MY
name: Malaysia
native:
  name: Malaysia
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{subdistrict}}
    {{postcode}} {{city}}
    {{state}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Nama Bangunan/Syarikat
      placeholder: Menara Petronas
      required: false
      type: text
    - key: houseNumber
      label: No. Rumah/Unit
      placeholder: Level 4
      required: false
      type: text
    - key: street
      label: Nama Jalan
      placeholder: Persiaran Petronas
      required: true
      type: text
    - key: subdistrict
      label: Kawasan/Taman
      placeholder: KLCC
      required: false
      type: text
    - key: city
      label: Bandar
      placeholder: Kuala Lumpur
      required: true
      type: text
    - key: state
      label: Negeri
      placeholder: Wilayah Persekutuan
      required: true
      type: text
    - key: postcode
      label: Poskod
      placeholder: "50088"
      required: true
      type: text
domestic:
  en:
    name: English
    addressFormat: |-
      {{organization}}
      {{houseNumber}} {{street}}
      {{subdistrict}}
      {{postcode}} {{city}}
      {{state}}
    ordering: small-to-big
    fields:
      - key: organization
        label: Building/Company
        placeholder: Petronas Twin Towers
      - key: houseNumber
        label: House/Unit No.
        placeholder: Level 4
      - key: street
        label: Street Name
        placeholder: Persiaran Petronas
      - key: subdistrict
        label: Area/Neighborhood
        placeholder: KLCC
      - key: city
        label: City/Town
        placeholder: Kuala Lumpur
      - key: state
        label: State
        placeholder: Federal Territory
      - key: postcode
        label: Postcode
        placeholder: "50088"
        required: true
  zh:
    name: 简体中文
    addressFormat: |-
      马来西亚 {{postcode}}
      {{state}} {{city}}
      {{subdistrict}}
      {{street}} {{houseNumber}}
      {{organization}}
    ordering: big-to-small
    fields:
      - key: organization
        label: 大厦/公司
        placeholder: 双峰塔
      - key: houseNumber
        label: 门牌/楼层
        placeholder: 4层
      - key: street
        label: 街道名称
        placeholder: 双峰塔路
      - key: subdistrict
        label: 地区
        placeholder: KLCC
      - key: city
        label: 城市
        placeholder: 吉隆坡
      - key: state
        label: 州属
        placeholder: 联邦直辖区
      - key: postcode
        label: 邮政编码
        placeholder: "50088"
        required: true
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{subdistrict}}
    {{postcode}} {{city}}
    {{state}}
    MALAYSIA
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Company
      placeholder: Petronas Twin Towers
    - key: houseNumber
      label: House/Unit No.
      placeholder: Level 4
    - key: street
      label: Street Address
      placeholder: Persiaran Petronas
    - key: subdistrict
      label: Neighborhood/Area
      placeholder: KLCC
    - key: city
      label: City/Town
      placeholder: Kuala Lumpur
    - key: state
      label: State/Territory
      placeholder: Federal Territory
    - key: postcode
      label: Postal Code
      placeholder: "50088"
      required: true
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://www.pos.com.my/postcode-finder
  source: Pos Malaysia
addressRules:
  languages:
    - code: ms
      name: Malay
  nativeOrder:
    - postcode
    - state
    - district
    - city
    - street
    - houseNumber
    - name
  englishOrder:
    - postcode
    - state
    - district
    - city
    - street
    - houseNumber
    - name
  regionalHierarchy:
    - state
    - district
  postalCode:
    label: 5 digits required
    required: true
    usage: required
  openSourceIds:
    - pos-malaysia
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nasa-srtm
    - jaxa-aw3d30
    - gebco-bathymetry
    - gmrt-topography
    - hydrosheds
    - esa-worldcover
    - protected-planet-wdpa
    - gbif-occurrence
openSourceIds:
  - pos-malaysia
