countryCode: PH
name: Philippines
native:
  name: English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{subdistrict}}, {{district}}
    {{city}}, {{state}}
    {{postcode}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Company
      placeholder: SM Mall of Asia
    - key: houseNumber
      label: Unit/House No.
      placeholder: Unit 101
    - key: street
      label: Street
      placeholder: Diokno Blvd
    - key: subdistrict
      label: Barangay
      placeholder: Barangay 76
    - key: district
      label: District
      placeholder: ""
    - key: city
      label: City/Municipality
      placeholder: Pasay City
    - key: state
      label: Province
      placeholder: Metro Manila
    - key: postcode
      label: ZIP Code
      placeholder: "1300"
domestic:
  tl:
    name: Tagalog
    addressFormat: |-
      {{organization}}
      {{houseNumber}} {{street}}
      {{subdistrict}}, {{district}}
      {{city}}, {{state}}
      {{postcode}}
    ordering: small-to-big
    fields:
      - key: organization
        label: Building/Kumpanya
        placeholder: SM Mall of Asia
      - key: houseNumber
        label: Blk/Lote No.
        placeholder: Unit 101
      - key: street
        label: Kalye
        placeholder: Diokno Blvd
      - key: subdistrict
        label: Barangay
        placeholder: Barangay 76
      - key: district
        label: Distrito
        placeholder: ""
      - key: city
        label: Lungsod/Bayan
        placeholder: Pasay City
      - key: state
        label: Lalawigan
        placeholder: Metro Manila
      - key: postcode
        label: ZIP Code
        placeholder: "1300"
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{subdistrict}}, {{district}}
    {{city}}, {{state}}
    {{postcode}}
    PHILIPPINES
  ordering: small-to-big
  fields:
    - key: organization
      label: Building/Company
      placeholder: SM Mall of Asia
    - key: houseNumber
      label: House/Unit No.
      placeholder: Unit 101
    - key: street
      label: Street Address
      placeholder: Diokno Blvd
    - key: subdistrict
      label: Barangay/Neighborhood
      placeholder: Barangay 76
    - key: district
      label: District
      placeholder: ""
    - key: city
      label: City/Municipality
      placeholder: Pasay City
    - key: state
      label: Province/State
      placeholder: Metro Manila
    - key: postcode
      label: Postal Code
      placeholder: "1300"
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://phlpost.gov.ph/zip-code-locator/
  source: PHLPost
addressRules:
  languages:
    - code: fil
      name: Filipino
    - code: en
      name: English
  nativeOrder:
