countryCode: MN
name: Mongolia
native:
  name: Монгол улс
  addressFormat: |-
    {{postcode}}
    {{state}} {{city}}
    {{district}} {{subdistrict}}
    {{street}} {{houseNumber}}
  ordering: big-to-small
  fields:
    - key: postcode
      label: Шуудангийн код
      placeholder: "14210"
      required: true
      type: text
    - key: state
      label: Аймаг/Хот
      placeholder: Улаанбаатар
      required: true
      type: text
    - key: city
      label: Сум/Дүүрэг
      placeholder: Сүхбаатар
      required: true
      type: text
    - key: district
      label: Баг/Хороо
      placeholder: 1-р хороо
      required: false
      type: text
    - key: subdistrict
      label: Хэсэг
      placeholder: 12-р хэсэг
      required: false
      type: text
    - key: street
      label: Гудамж
      placeholder: Энх тайвны өргөн чөлөө
      required: false
      type: text
    - key: houseNumber
      label: Байшин/Хаалга
      placeholder: 10-24
      required: false
      type: text
english:
  addressFormat: |-
    {{houseNumber}} {{street}}
    {{subdistrict}}, {{district}}
    {{city}}, {{state}}
    {{postcode}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: houseNumber
      label: Building/Door
      placeholder: 10-24
      required: false
      type: text
    - key: street
      label: Street
      placeholder: Peace Avenue
      required: false
      type: text
    - key: subdistrict
      label: Section
      placeholder: Section 12
      required: false
      type: text
    - key: district
      label: Sub-district
      placeholder: 1st khoroo
      required: false
      type: text
    - key: city
      label: District
      placeholder: Sukhbaatar
      required: true
      type: text
    - key: state
      label: Province/City
      placeholder: Ulaanbaatar
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "14210"
      required: true
      type: text
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://zipcode.mn/
  source: Mongol Post / zipcode.mn / ALAMGC NSDI
addressRules:
  languages:
    - code: mn-Cyrl
      name: Mongolian (Cyrillic)
  nativeOrder:
    - postcode
    - aimag
    - sum
    - bag
    - street
    - building
    - name
  englishOrder:
    - postcode
    - province
    - soum
    - bag
    - street
    - building
    - name
  regionalHierarchy:
    - aimag
    - sum
    - bag
  postalCode:
    label: 5 digits, e.g. 12345
    required: false
    usage: used
  openSourceIds:
    - alamgc-mongolia
    - nsdi-mongolia
    - zipcode-mn
    - hot-osm-mongolia
    - osm-mongolia
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - nasa-srtm
    - jaxa-aw3d30
    - gebco-bathymetry
    - gmrt-topography
    - hydrosheds
    - esa-worldcover
    - protected-planet-wdpa
    - gbif-occurrence
