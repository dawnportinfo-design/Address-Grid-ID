countryCode: SJ
name: Jan Mayen
native:
  name: Jan Mayen
  addressFormat: |-
    {{recipient}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    Jan Mayen
  ordering: small-to-big
  fields:
    - key: recipient
      label: Navn
      placeholder: Fullt navn
      required: true
      type: text
    - key: street
      label: Gate/Bygning
      placeholder: Gatenavn eller bygning
      required: true
      type: text
    - key: houseNumber
      label: Husnummer
      placeholder: Nr
      required: true
      type: text
    - key: postcode
      label: Postnummer
      placeholder: JM-3
      required: true
      type: text
    - key: city
      label: Poststed
      placeholder: Jan Mayen
      required: true
      type: text
