countryCode: DK
name: Denmark
native:
  name: Danmark
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: Navn
      placeholder: Fullt navn
      required: true
      type: text
    - key: organization
      label: Firma/Organisation
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Vej
      placeholder: Strøget
      required: true
      type: text
    - key: houseNumber
      label: Husnummer
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postnummer
      placeholder: "1000"
      required: true
      type: text
    - key: city
      label: By
      placeholder: København
      required: true
      type: text
english:
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{country}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: Name
      placeholder: Full Name
      required: true
      type: text
    - key: organization
      label: Company/Organization
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Street
      placeholder: Stroget
      required: true
      type: text
    - key: houseNumber
      label: House No.
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "1000"
      required: true
      type: text
    - key: city
      label: City
      placeholder: Copenhagen
      required: true
      type: text
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://api.dataforsyningen.dk/postnumre
  source: Dataforsyningen DAWA postnumre API / Danish Address Register
addressRules:
  languages:
    - code: da
      name: Danish
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - city
  postalCode:
    label: 4 digits required
    required: true
    usage: required
  openSourceIds:
    - dataforsyningen-denmark
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - danish-address-register-dar
    - geodanmark
    - copernicus-dem
    - copernicus-corine-land-cover
    - emodnet-bathymetry
    - emodnet-seabed-habitats
    - eea-natura-2000
    - eea-eunis-habitats
    - jrc-esdac-soils
openSourceIds:
