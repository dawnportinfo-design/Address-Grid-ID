countryCode: LI
name: Liechtenstein
native:
  name: Liechtenstein
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Firma/Organisation
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Strasse
      placeholder: Städtle
      required: true
      type: text
    - key: houseNumber
      label: Hausnummer
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postleitzahl
      placeholder: "9490"
      required: true
      type: text
    - key: city
      label: Ort
      placeholder: Vaduz
      required: true
      type: text
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{postcode}} {{city}}
    LIECHTENSTEIN
  ordering: small-to-big
  fields:
    - key: organization
      label: Co./Org.
      placeholder: ""
    - key: houseNumber
      label: No.
      placeholder: "1"
    - key: street
      label: Street (Latin)
      placeholder: Staedtle
    - key: postcode
      label: Postcode
      placeholder: "9490"
      required: true
    - key: city
      label: City
      placeholder: Vaduz
international:
  de:
    name: Deutsch (International)
    addressFormat: |-
      {{organization}}
      {{street}} {{houseNumber}}
      {{postcode}} {{city}}
      LIECHTENSTEIN
    ordering: small-to-big
    fields:
      - key: organization
        label: Firma/Org. (Latein)
        placeholder: ""
      - key: street
        label: Strasse (Latein)
        placeholder: Städtle
      - key: houseNumber
        label: Nr.
        placeholder: "1"
      - key: postcode
        label: PLZ
        placeholder: "9490"
        required: true
      - key: city
        label: Stadt
        placeholder: Vaduz
postalCode:
  format: NNNN
  regex: ^\d{4}$
  api: https://www.openplzapi.org/en/
  source: OpenPLZ API
addressRules:
  languages:
    - code: de
      name: German
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - country
  regionalHierarchy:
    - city
  postalCode:
    label: 4 digits required
    required: true
    usage: required
  openSourceIds:
    - openplzapi
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
    - upu-addressing
    - copernicus-dem
    - copernicus-corine-land-cover
    - emodnet-bathymetry
    - emodnet-seabed-habitats
    - eea-natura-2000
    - eea-eunis-habitats
    - jrc-esdac-soils
openSourceIds:
  - openplzapi
  - osm-nominatim
  - osm-overpass
  - openaddresses
  - geonames-postal
  - geonames-gazetteer
  - geoboundaries
  - upu-addressing
  - copernicus-dem
  - copernicus-corine-land-cover
  - emodnet-bathymetry
  - emodnet-seabed-habitats
  - eea-natura-2000
  - eea-eunis-habitats
  - jrc-esdac-soils
