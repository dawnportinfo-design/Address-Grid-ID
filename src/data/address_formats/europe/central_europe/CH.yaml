countryCode: CH
name: Switzerland
native:
  name: Schweiz
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Firma/Organisation
      placeholder: ""
      required: false
      type: text
    - key: street
      label: Strasse
      placeholder: Bahnhofstrasse
      required: true
      type: text
    - key: houseNumber
      label: Hausnummer
      placeholder: "1"
      required: true
      type: text
    - key: postcode
      label: Postleitzahl
      placeholder: "8001"
      required: true
      type: text
    - key: city
      label: Ort
      placeholder: Zürich
      required: true
      type: text
