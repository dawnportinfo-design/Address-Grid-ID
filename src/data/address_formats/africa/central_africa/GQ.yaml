    {{street}}
    {{city}}
    Equatorial Guinea
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Teodoro Obiang
      required: true
      type: text
    - key: street
      label: Street Address
      placeholder: 123 Malabo St
      required: true
      type: text
    - key: city
      label: City
      placeholder: Malabo
      required: true
      type: text
