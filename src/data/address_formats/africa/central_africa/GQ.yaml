countryCode: GQ
name: Equatorial Guinea
native:
  name: Guinea Ecuatorial
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}}
    Guinea Ecuatorial
  ordering: small-to-big
  fields:
    - key: recipient
      label: Nombre Completo
      placeholder: Teodoro Obiang
      required: true
      type: text
    - key: street
      label: Endereço
      placeholder: Calle de Malabo, 123
      required: true
      type: text
    - key: city
      label: Ciudad
      placeholder: Malabo
      required: true
      type: text
