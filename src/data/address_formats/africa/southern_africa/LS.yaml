countryCode: LS
name: Lesotho
native:
  name: Lesotho
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}} {{postcode}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Letsie III
      required: true
      type: text
    - key: street
      label: Street Address / PO Box
      placeholder: PO Box 123
      required: true
      type: text
    - key: city
      label: City / Town
      placeholder: Maseru
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "100"
      required: false
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}} {{postcode}}
    Lesotho
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Letsie III
      required: true
      type: text
    - key: street
      label: Street Address / PO Box
      placeholder: PO Box 123
      required: true
      type: text
    - key: city
      label: City / Town
      placeholder: Maseru
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "100"
      required: false
      type: text
postalCode:
  format: NNN
  regex: ^\d{3}$
  api: null
  source: Postal metadata from AGID Southern Africa and Indian Ocean regional table; open OSS source not configured
addressRules:
  languages:
    - code: en
      name: English
    - code: st
      name: Sesotho
  deliveryLanguages:
    - code: en
      name: English
    - code: st
      name: Sesotho
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - region
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - region
    - country
  regionalHierarchy:
    - district
    - communityCouncil
  postalCode:
    label: 3 digits used
    required: false
    usage: used
  openSourceIds:
