countryCode: MG
name: Madagascar
native:
  name: Madagasikara
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
  ordering: small-to-big
  fields:
    - key: recipient
      label: Anarana feno
      placeholder: Jean Rakoto
      required: true
      type: text
    - key: street
      label: Adiresy
      placeholder: Lot 123
      required: true
      type: text
    - key: postcode
      label: Kaody paositra
      placeholder: "101"
      required: true
      type: text
    - key: city
      label: Tanàna
      placeholder: Antananarivo
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
    Madagascar
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Jean Rakoto
      required: true
      type: text
    - key: street
      label: Street Address
      placeholder: Lot 123
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: "101"
      required: true
      type: text
    - key: city
      label: City
      placeholder: Antananarivo
      required: true
      type: text
postalCode:
  format: NNN
  regex: ^\d{3}$
  api: null
  source: Postal metadata from AGID East Africa regional table; open OSS source not configured
addressRules:
  languages:
    - code: fr
      name: French
  nativeOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - region
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - postcode
    - city
    - region
    - country
  regionalHierarchy:
    - region
    - district
    - commune
  postalCode:
    label: 3 digits required
    required: true
    usage: required
  openSourceIds:
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
