countryCode: SO
name: Somalia
native:
  name: Soomaaliya
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}} {{postcode}}
    Somalia
  ordering: small-to-big
  fields:
    - key: recipient
      label: Magaca oo Full
      placeholder: Axmed Cali
      required: true
      type: text
    - key: street
      label: Cinwaanka
      placeholder: Wadada Maka Al-Mukarama
      required: true
      type: text
    - key: city
      label: Magaalada
      placeholder: Muqdisho
      required: true
      type: text
    - key: postcode
      label: Boostada
      placeholder: AD 100
      required: false
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}} {{postcode}}
    Somalia
  ordering: small-to-big
  fields:
    - key: recipient
      label: Full Name
      placeholder: Ahmed Ali
      required: true
      type: text
    - key: street
      label: Street Address
      placeholder: Maka Al-Mukarama Rd
      required: true
      type: text
    - key: city
      label: City
      placeholder: Mogadishu
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: AD 100
      required: false
      type: text
postalCode:
  format: AA NNN
  regex: ^[A-Z]{2}\s?\d{3}$
  api: null
  source: Somalia Ministry of Communications and Technology postal service information
addressRules:
  languages:
    - code: so
      name: Somali
    - code: ar
      name: Arabic
    - code: en
      name: English
  nativeOrder:
    - name
    - street
    - postcode
    - city
    - region
    - country
  englishOrder:
    - name
    - street
    - postcode
    - city
    - region
    - country
  regionalHierarchy:
    - region
    - district
  postalCode:
    label: Somalia alpha-2 plus 3 digits used
    required: false
    usage: used
  openSourceIds:
