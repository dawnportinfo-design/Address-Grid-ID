countryCode: SLND
name: Somaliland
native:
  name: Somaliland
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{city}}
    {{region}}
    Somaliland
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full name
      required: true
      type: text
    - key: street
      label: Street / Local address
      placeholder: Street, block, village, or landmark
      required: true
      type: text
    - key: city
      label: City / Locality
      placeholder: City or locality
      required: true
      type: text
    - key: region
      label: Region / Territory
      placeholder: Region
      required: false
      type: text
    - key: postcode
      label: Postal Code
      placeholder: Postal code if used
      required: false
      type: text
