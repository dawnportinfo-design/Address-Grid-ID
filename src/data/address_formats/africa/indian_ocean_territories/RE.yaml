countryCode: RE
name: La Réunion
native:
  name: La Réunion
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
    La Réunion
  ordering: small-to-big
  fields:
    - key: recipient
      label: Destinataire
      placeholder: Nom complet
      required: true
      type: text
    - key: street
      label: Numéro + Rue
      placeholder: Numéro et nom de la rue
      required: true
      type: text
    - key: postcode
      label: Code postal
      placeholder: 974xx
      required: true
      type: text
    - key: city
      label: Ville
      placeholder: ex. Saint-Denis
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
    Réunion
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street Number + Street
      placeholder: Number and street name
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: 974xx
      required: true
      type: text
    - key: city
      label: City
      placeholder: e.g. Saint-Denis
      required: true
      type: text
postalCode:
  format: 974NN
  regex: ^974\d{2}$
  api: null
  source: La Poste
