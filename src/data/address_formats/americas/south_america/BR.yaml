    - street
    - houseNumber
    - neighborhood
    - city
    - state
    - postcode
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - neighborhood
    - city
    - region
    - postcode
    - country
  regionalHierarchy:
    - state
    - municipality
    - neighborhood
  postalCode:
