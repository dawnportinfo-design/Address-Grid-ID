countryCode: BR
name: Brazil
native:
  name: Português
  addressFormat: |-
    {{organization}}
    {{street}}, {{houseNumber}}
    {{subdistrict}}
    {{postcode}} {{city}}, {{state}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Empresa
      placeholder: ""
    - key: street
      label: Rua/Avenida
      placeholder: Avenida Paulista
      required: true
    - key: houseNumber
      label: Número
      placeholder: "123"
      required: true
    - key: subdistrict
      label: Bairro
      placeholder: Bela Vista
      required: true
    - key: postcode
      label: CEP
      placeholder: 01310-100
      required: true
    - key: city
      label: Cidade
      placeholder: São Paulo
      required: true
    - key: state
      label: Estado
      placeholder: SP
      required: true
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{street}}, {{houseNumber}}
    {{subdistrict}}
    {{postcode}} {{city}}, {{state}}
    BRAZIL
  ordering: small-to-big
  fields:
    - key: organization
      label: Co./Org.
      placeholder: ""
    - key: street
      label: St./Ave. (Latin)
      placeholder: Av. Paulista
    - key: houseNumber
      label: No.
      placeholder: "123"
    - key: subdistrict
      label: Neighborhood
      placeholder: Bela Vista
    - key: postcode
      label: CEP
      placeholder: 01310-100
      required: true
    - key: city
      label: City
      placeholder: Sao Paulo
    - key: state
      label: State Code
      placeholder: SP
international:
  pt:
    name: Português (Internacional)
    addressFormat: |-
      {{organization}}
      {{street}}, {{houseNumber}}
      {{subdistrict}}
      {{postcode}} {{city}}, {{state}}
      BRASIL
    ordering: small-to-big
    fields:
      - key: organization
        label: Empresa (Latim)
        placeholder: ""
      - key: street
        label: Rua/Av. (Latim)
        placeholder: Av. Paulista
      - key: houseNumber
        label: Nº
        placeholder: "123"
      - key: subdistrict
        label: Bairro
        placeholder: Bela Vista
      - key: postcode
        label: CEP
        placeholder: 01310-100
        required: true
      - key: city
        label: Cidade
        placeholder: São Paulo
      - key: state
        label: Edo. (Sigla)
        placeholder: SP
postalCode:
  format: NNNNN-NNN
  regex: ^\d{5}-?\d{3}$
  api: https://viacep.com.br/ws/{cep}/json/
  source: ViaCEP / BrasilAPI / Correios Brazil
openSourceIds:
  - viacep-br
  - brasilapi
  - osm-nominatim
  - osm-overpass
  - openaddresses
  - geonames-postal
  - geonames-gazetteer
  - geoboundaries
  - upu-addressing
  - zippopotam
  - noaa-etopo
  - geobc-global-multi-resolution-topography
  - hydrosheds
  - protected-planet-wdpa
  - gbif-occurrence
  - esa-worldcover
  - usgs-3dep
  - nrcan-geospatial
  - conabio-geoportal
  - ibge-geosciences
  - inpe-terrabrasilis
addressRules:
  languages:
    - code: pt-BR
      name: Portuguese (Brazil)
    - code: en
      name: English
  deliveryLanguages:
