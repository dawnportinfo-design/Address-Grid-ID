native:
  name: Spanish
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{subdistrict}}
    {{city}}, {{state}}
    {{postcode}}
    Uruguay
  ordering: small-to-big
  fields:
    - key: organization
      label: Organization
      placeholder: ""
    - key: street
      label: Calle / Avenida
      placeholder: ""
    - key: houseNumber
      label: Numero
      placeholder: ""
    - key: subdistrict
      label: Barrio / Colonia
      placeholder: ""
    - key: city
      label: Ciudad / Municipio
      placeholder: ""
    - key: state
      label: Departamento / Provincia
      placeholder: ""
    - key: postcode
      label: Codigo Postal
      placeholder: ""
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{city}}, {{state}} {{postcode}}
    URUGUAY
  ordering: small-to-big
  fields: []
international:
  es:
    name: Español (Internacional)
    addressFormat: |-
      {{organization}}
      {{street}} {{houseNumber}}
      {{subdistrict}}
      {{city}}, {{state}}
      {{postcode}}
      Uruguay
    ordering: small-to-big
    fields: []
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: null
  source: Infraestructura de Datos Espaciales de Uruguay / Correo Uruguayo / GeoNames
addressRules:
  languages:
    - code: es
      name: Spanish
    - code: en
      name: English
  deliveryLanguages:
    - code: es
      name: Spanish
    - code: en
      name: English
  nativeOrder:
