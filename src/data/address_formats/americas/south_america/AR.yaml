countryCode: AR
name: Argentina
native:
  name: Español
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{state}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Empresa
      placeholder: ""
    - key: street
      label: Calle
      placeholder: Avenida de Mayo
      required: true
    - key: houseNumber
      label: Número
      placeholder: "123"
      required: true
    - key: postcode
      label: Código Postal
      placeholder: C1084
      required: true
    - key: city
      label: Ciudad
      placeholder: Buenos Aires
      required: true
    - key: state
      label: Provincia
      placeholder: CAPITAL FEDERAL
      required: true
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    {{state}}
    ARGENTINA
  ordering: small-to-big
  fields:
    - key: organization
      label: Co./Org.
      placeholder: ""
    - key: street
      label: St./Ave. (Latin)
      placeholder: Av. de Mayo
      required: true
    - key: houseNumber
      label: No.
      placeholder: "123"
      required: true
    - key: postcode
      label: Postcode
      placeholder: C1084
      required: true
    - key: city
      label: City
      placeholder: Buenos Aires
      required: true
    - key: state
      label: Prov. Code
      placeholder: B
      required: true
international:
  es:
    name: Español (Internacional)
    addressFormat: |-
      {{organization}}
      {{street}} {{houseNumber}}
      {{postcode}} {{city}}
      {{state}}
      ARGENTINA
    ordering: small-to-big
    fields:
      - key: organization
        label: Empresa (Latín)
        placeholder: ""
      - key: street
        label: Calle/Via (Latín)
        placeholder: Av. de Mayo
        required: true
      - key: houseNumber
        label: Nº
        placeholder: "123"
        required: true
      - key: postcode
        label: C.P. (Latin)
        placeholder: C1084
        required: true
      - key: city
        label: Ciudad
        placeholder: Buenos Aires
        required: true
      - key: state
        label: Prov. (Sigla)
        placeholder: B
        required: true
postalCode:
  format: NNNN or ANNNNAAA
  regex: ^([A-Z]?\d{4}[A-Z]{0,3})$
  source: Argentina Georef API / Correo Argentino / GeoNames
  api: null
openSourceIds:
  - georef-ar
  - osm-nominatim
  - osm-overpass
  - openaddresses
  - geonames-postal
  - geonames-gazetteer
  - geoboundaries
  - upu-addressing
  - zippopotam
  - noaa-etopo
  - geobc-global-multi-resolution-topography
  - hydrosheds
  - protected-planet-wdpa
  - gbif-occurrence
  - esa-worldcover
  - usgs-3dep
  - nrcan-geospatial
  - conabio-geoportal
  - ibge-geosciences
  - inpe-terrabrasilis
addressRules:
  languages:
    - code: es
      name: Spanish
    - code: en
      name: English
  deliveryLanguages:
    - code: es
      name: Spanish
    - code: en
      name: English
  nativeOrder:
    - name
    - street
    - houseNumber
    - neighborhood
    - city
    - departmentOrProvince
    - postcode
    - country
  englishOrder:
    - name
    - street
    - houseNumber
    - neighborhood
    - city
    - region
    - postcode
    - country
  regionalHierarchy:
    - province
    - city
  postalCode:
    label: NNNN or ANNNNAAA
    required: true
    usage: required
  openSourceIds:
    - georef-ar
    - osm-nominatim
    - osm-overpass
    - openaddresses
    - geonames-postal
    - geonames-gazetteer
    - geoboundaries
