countryCode: CL-EA
name: Easter Island (Rapa Nui)
native:
  name: Rapa Nui / Isla de Pascua
  addressFormat: |-
    {{recipient}}
    {{organization}}
    {{street}} {{houseNumber}}
    {{postcode}} {{city}}
    Rapa Nui, Chile
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full name
      required: true
      type: text
    - key: organization
      label: Organization / Station
      placeholder: Organization, station, or facility
      required: false
      type: text
    - key: street
      label: Street / Local address
      placeholder: Street, road, sector, or locality
      required: false
      type: text
    - key: houseNumber
      label: House / Unit No.
      placeholder: Number
      required: false
      type: text
    - key: postcode
      label: Postal Code
      placeholder: Postal code if used
      required: true
      type: text
    - key: city
      label: City / Locality
      placeholder: City, island, base, or locality
      required: true
      type: text
