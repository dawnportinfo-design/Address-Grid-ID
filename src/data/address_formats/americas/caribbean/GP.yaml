countryCode: GP
name: Guadeloupe
native:
  name: Guadeloupe
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
    Guadeloupe
  ordering: small-to-big
  fields:
    - key: recipient
      label: Destinataire
      placeholder: Nom complet
      required: true
      type: text
    - key: street
      label: Numéro + Rue
      placeholder: Numéro et nom de la rue
      required: true
      type: text
    - key: postcode
      label: Code postal
      placeholder: 971xx
      required: true
      type: text
    - key: city
      label: Ville
      placeholder: ex. Basse-Terre
      required: true
      type: text
english:
  addressFormat: |-
    {{recipient}}
    {{street}}
    {{postcode}} {{city}}
    Guadeloupe
  ordering: small-to-big
  fields:
    - key: recipient
      label: Recipient
      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street Number + Street
      placeholder: Number and street name
      required: true
      type: text
    - key: postcode
      label: Postal Code
      placeholder: 971xx
      required: true
      type: text
    - key: city
      label: City
      placeholder: e.g. Basse-Terre
      required: true
      type: text
postalCode:
  format: 971NN
  regex: ^971\d{2}$
  api: null
  source: La Poste
addressRules:
  languages:
    - code: fr
