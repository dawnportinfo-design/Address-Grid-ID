      placeholder: Full Name
      required: true
      type: text
    - key: street
      label: Street
      placeholder: Street name
      required: true
      type: text
    - key: houseNumber
      label: House No
      placeholder: No
      required: true
      type: text
    - key: city
      label: City
      placeholder: Oranjestad
      required: true
      type: text
postalCode:
  format: A1A-style optional carrier/local code
  regex: ^[A-Z]\d[A-Z]$
  source: Territory postal format metadata / local postal operator guidance
