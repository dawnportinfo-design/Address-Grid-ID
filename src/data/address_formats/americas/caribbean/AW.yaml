countryCode: AW
name: Aruba
native:
  name: Aruba
  addressFormat: |-
    {{recipient}}
    {{street}} {{houseNumber}}
    {{city}}
    Aruba
  ordering: small-to-big
  fields:
    - key: recipient
      label: Naam
      placeholder: Volledige naam
      required: true
      type: text
    - key: street
      label: Straat
      placeholder: Straatnaam
      required: true
      type: text
    - key: houseNumber
      label: Huisnummer
      placeholder: Nr
      required: true
      type: text
    - key: city
      label: Stad
      placeholder: Oranjestad
      required: true
      type: text
english:
  addressFormat: |-
