native:
  name: Spanish
  addressFormat: |-
    {{organization}}
    {{street}} {{houseNumber}}
    {{subdistrict}}
    {{city}}, {{state}}
    {{postcode}}
    Costa Rica
  ordering: small-to-big
  fields:
    - key: organization
      label: Organization
      placeholder: ""
    - key: street
      label: Calle / Avenida
      placeholder: ""
    - key: houseNumber
      label: Numero
      placeholder: ""
    - key: subdistrict
      label: Barrio / Colonia
      placeholder: ""
    - key: city
      label: Ciudad / Municipio
      placeholder: ""
    - key: state
      label: Departamento / Provincia
      placeholder: ""
    - key: postcode
      label: Codigo Postal
      placeholder: ""
      required: true
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{city}}, {{state}} {{postcode}}
    COSTA RICA
  ordering: small-to-big
  fields:
    - key: organization
      label: Building / Company
      placeholder: ""
    - key: houseNumber
      label: House No.
      placeholder: ""
    - key: street
      label: Street
      placeholder: ""
    - key: city
      label: City / Town
      placeholder: ""
    - key: state
      label: State / Province
      placeholder: ""
    - key: postcode
      label: Postal Code
      placeholder: ""
      required: true
international:
  es:
    name: Español (Internacional)
    addressFormat: |-
      {{organization}}
      {{street}} {{houseNumber}}
      {{subdistrict}}
      {{city}}, {{state}}
      {{postcode}}
      Costa Rica
    ordering: small-to-big
    fields:
      - key: organization
        label: Organizacion / Empresa
        placeholder: ""
      - key: street
        label: Calle / Avenida
        placeholder: ""
      - key: houseNumber
        label: Numero
        placeholder: ""
      - key: subdistrict
        label: Barrio / Colonia
        placeholder: ""
      - key: city
        label: Ciudad / Municipio
        placeholder: ""
      - key: state
        label: Estado / Provincia
        placeholder: ""
      - key: postcode
        label: Codigo Postal
        placeholder: ""
        required: true
postalCode:
  format: NNNNN
  regex: ^\d{5}$
  api: https://correos.go.cr/codigo-postal/
  source: Correos de Costa Rica / SNIT
addressRules:
  languages:
