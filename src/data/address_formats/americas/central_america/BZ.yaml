countryCode: BZ
name: Belize
native:
  name: English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{city}}
    {{state}}
  ordering: small-to-big
  fields:
    - key: organization
      label: Company
      placeholder: ""
    - key: houseNumber
      label: Lot/House No.
      placeholder: "101"
    - key: street
      label: Street/Road
      placeholder: Albert Street
    - key: city
      label: Town/City
      placeholder: Belize City
    - key: state
      label: District
      placeholder: Belize District
domestic:
  es:
    name: Español
    addressFormat: |-
      {{organization}}
      {{houseNumber}} {{street}}
      {{city}}
      {{state}}
    ordering: small-to-big
    fields:
      - key: organization
        label: Empresa
        placeholder: ""
      - key: houseNumber
        label: No. de Lote
        placeholder: "101"
      - key: street
        label: Calle
        placeholder: Calle Albert
      - key: city
        label: Ciudad
        placeholder: Ciudad de Belice
      - key: state
        label: Distrito
        placeholder: Distrito de Belice
english:
  name: International English
  addressFormat: |-
    {{organization}}
    {{houseNumber}} {{street}}
    {{city}}, {{state}}
    BELIZE
  ordering: small-to-big
  fields:
    - key: organization
      label: Building / Company
      placeholder: ""
    - key: houseNumber
      label: House No.
      placeholder: "101"
    - key: street
      label: Street
      placeholder: Albert Street
    - key: city
      label: City / Town
      placeholder: Belize City
    - key: state
      label: State / Province
      placeholder: Belize District
openSourceIds:
  - belize-statistical-institute
  - osm-nominatim
  - osm-overpass
  - openaddresses
  - geonames-postal
  - geonames-gazetteer
  - geoboundaries
  - upu-addressing
  - zippopotam
  - noaa-etopo
  - geobc-global-multi-resolution-topography
  - hydrosheds
  - protected-planet-wdpa
  - gbif-occurrence
  - esa-worldcover
  - usgs-3dep
  - nrcan-geospatial
  - conabio-geoportal
  - ibge-geosciences
  - inpe-terrabrasilis
postalCode:
  format: optional
  regex: null
  api: null
  source: Statistical Institute of Belize / GeoNames
addressRules:
  languages:
